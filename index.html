<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雄武丘陵地区青葉工区区画整理工事　現場タイムラプス | 株式会社渡辺組</title>
<style>
  :root{
    --navy:#1583bd; --navy2:#0e6396; --accent:#29abe2; --bg:#f2f9fd;
    --card:#ffffff; --text:#2c3e50; --muted:#7f8c9b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:26px 20px 20px}
  .wrap{max-width:1080px;margin:0 auto}
  header h1{font-size:1.5rem;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
  header .sub{margin-top:6px;font-size:.85rem;color:#e8f4fb}
  .brand{display:inline-block;background:#fff;border-radius:8px;padding:7px 14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .brand img{height:40px;display:block}
  .notice{background:#e8f4fb;border:1px solid #bfe0f2;color:#0e6396;font-size:.75rem;padding:5px 12px;border-radius:6px;max-width:1080px;margin:10px auto 0;text-align:center}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 18px}
  .chip{border:1px solid #c8d2e0;background:#fff;color:var(--text);border-radius:999px;padding:7px 16px;font-size:.85rem;cursor:pointer;transition:.15s}
  .chip.active{background:var(--navy2);color:#fff;border-color:var(--navy2)}
  .count{margin-left:auto;font-size:.8rem;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(18,116,173,.10);display:flex;flex-direction:column}
  .player{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#16223c,#16223c 12px,#182741 12px,#182741 24px);cursor:pointer}
  .player.open{cursor:default}
  .player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .player .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .play span{width:58px;height:58px;border-radius:50%;background:rgba(41,171,226,.95);border:2px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;padding-left:4px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:.15s}
  .player:hover .play span{transform:scale(1.1)}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .close-btn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(10,25,45,.72);color:#fff;font-size:1rem;line-height:1;cursor:pointer}
  .close-btn:hover{background:rgba(10,25,45,.92)}
  .info{padding:12px 14px 14px}
  .badge{display:inline-block;background:#ddf1fb;color:var(--navy2);font-size:.72rem;font-weight:700;border-radius:5px;padding:3px 8px;margin-bottom:6px}
  .info h2{font-size:1.05rem;line-height:1.4}
  .links{margin-top:8px;font-size:.78rem;color:var(--muted)}
  .links a{color:#1583bd;text-decoration:none}
  .links a:hover{text-decoration:underline}
  .fs-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:11px 14px;background:var(--navy);color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-size:.88rem;font-weight:600;transition:.15s;min-height:44px}
  .fs-btn:hover{background:var(--navy2)}
  .fs-btn .icon{font-size:1.05rem;line-height:1}
  [hidden]{display:none !important}
  .sec-title{font-size:1rem;color:var(--navy2);margin:4px 0 12px;padding-left:10px;border-left:4px solid var(--accent)}
  .grid + .sec-title{margin-top:30px}
  .badge.digest{background:#fff1d6;color:#8a5a00;margin-left:6px}
  .load-error{grid-column:1/-1;background:#fdecea;border:1px solid #f5b9b3;color:#a33a2f;border-radius:10px;padding:16px;font-size:.9rem;line-height:1.8}
  footer{border-top:1px solid #d3e9f5;background:#fff;padding:18px 16px 30px}
  footer .wrap{font-size:.8rem;color:var(--muted);line-height:1.9}
  footer a{color:#1583bd}
  @media (max-width:480px){ header h1{font-size:1.2rem} .brand img{height:30px} .grid{grid-template-columns:1fr} }
</style>
</head>

<script>
(function () {
  const grid = document.getElementById("grid");
  const filterBar = document.getElementById("filterBar");
  const digestGrid = document.getElementById("digestGrid");
  const digestTitle = document.getElementById("digestTitle");
  const monthlyTitle = document.getElementById("monthlyTitle");

  // 動画リストの記述ミス（カンマ抜け等）があっても真っ白にせず、原因を表示する
  if (typeof videos === "undefined" || !Array.isArray(videos)) {
    grid.innerHTML = '<div class="load-error">動画リストの読み込みに失敗しました。<br>' +
      'このHTML内の「videos」リストの記述（行末のカンマ抜け・かっこの対応など）を確認してください。<br>' +
      '直せない場合はページ管理者まで連絡してください。</div>';
    return;
  }

  let current = "すべて";
  let openEl = null; // いま再生中のプレーヤー（同時再生は1つまで）

  function labelOf(v) {
    const s = v.date.split("-");
    const from = s[0] + "年" + Number(s[1]) + "月";
    if (!v.until) return from;
    const e = v.until.split("-");
    return from + "〜" + (e[0] === s[0] ? "" : e[0] + "年") + Number(e[1]) + "月";
  }
  function thumbHTML(v) {
    return '<img src="https://drive.google.com/thumbnail?id=' + v.id + '&sz=w640" alt="" loading="lazy" onerror="this.remove()">' +
           '<div class="play"><span>▶</span></div>';
  }
  function closePlayer(player) {
    const v = videos.find(function (x) { return x.id === player.dataset.vid; });
    player.innerHTML = thumbHTML(v);
    player.classList.remove("open");
    if (openEl === player) openEl = null;
  }
  function openPlayer(player, v) {
    if (openEl && openEl !== player) closePlayer(openEl); // 前の再生を閉じる
    player.innerHTML =
      '<iframe src="https://drive.google.com/file/d/' + v.id + '/preview" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>' +
      '<button class="close-btn" aria-label="再生を閉じる">✕</button>';
    player.classList.add("open");
    player.querySelector(".close-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      closePlayer(player);
    });
    openEl = player;
  }

  function render() {
    // 現場名フィルタ
    const sites = ["すべて"].concat(Array.from(new Set(videos.map(function (v) { return v.site; }))));
    filterBar.innerHTML = "";
    sites.forEach(function (s) {
      const b = document.createElement("button");
      b.className = "chip" + (s === current ? " active" : "");
      b.textContent = s;
      b.onclick = function () { current = s; render(); };
      filterBar.appendChild(b);
    });
    const shown = videos
      .filter(function (v) { return current === "すべて" || v.site === current; })
      .slice()
      .sort(function (a, b) { return (b.until || b.date).localeCompare(a.until || a.date); }); // 新しい順
    const digests = shown.filter(function (v) { return v.until; });
    const monthly = shown.filter(function (v) { return !v.until; });
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = shown.length + " 本";
    filterBar.appendChild(c);

    // まとめ動画がない絞り込みでは見出しを出さず、従来どおりの1段表示にする
    const hasDigest = digests.length > 0;
    digestTitle.hidden = !hasDigest;
    digestGrid.hidden = !hasDigest;
    monthlyTitle.hidden = !hasDigest;

    // 動画カード
    grid.innerHTML = "";
    digestGrid.innerHTML = "";
    openEl = null;
    digests.forEach(function (v) { digestGrid.appendChild(makeCard(v)); });
    monthly.forEach(function (v) { grid.appendChild(makeCard(v)); });
  }

  function makeCard(v) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="player" role="button" tabindex="0" data-vid="' + v.id + '" aria-label="' + v.site + ' ' + labelOf(v) + ' を再生">' +
          thumbHTML(v) +
        '</div>' +
        '<div class="info">' +
          '<span class="badge">' + v.site + '</span>' +
          (v.until ? '<span class="badge digest">まとめ</span>' : '') +
          '<h2>' + labelOf(v) + '</h2>' +
          '<a class="fs-btn" href="https://drive.google.com/file/d/' + v.id + '/view" target="_blank" rel="noopener"><span class="icon">⛶</span>別タブでフル画面再生する</a>' +
        '</div>';
      const player = card.querySelector(".player");
      player.addEventListener("click", function () {
        if (!player.classList.contains("open")) openPlayer(player, v);
      });
      player.addEventListener("keydown", function (e) {
        if ((e.key === "Enter" || e.key === " ") && !player.classList.contains("open")) {
          e.preventDefault();
          openPlayer(player, v);
        }
      });
      return card;
  }

  try {
    render();
  } catch (err) {
    grid.innerHTML = '<div class="load-error">ページの表示中にエラーが発生しました：' + err.message + '<br>ページ管理者まで連絡してください。</div>';
  }
})();
</script>
